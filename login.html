<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OceanMart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🌊 OceanMart</div>
    <nav><a href="index.html">Beranda</a></nav>
  </header>

  <div class="auth-box">
    <h2>Selamat Datang 👋</h2>
    <p>Masuk ke akun OceanMart kamu</p>
    <form>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="btn">Login</button>
    </form>
    <p style="margin-top:16px;">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </div>
</body>
</html>
