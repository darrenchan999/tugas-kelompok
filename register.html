<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - OceanMart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🌊 OceanMart</div>
    <nav><a href="index.html">Beranda</a></nav>
  </header>

  <div class="auth-box">
    <h2>Buat Akun Baru 🐬</h2>
    <p>Gabung dan mulai belanja di OceanMart</p>
    <form>
      <input type="text" placeholder="Nama Lengkap" required>
      <input type="email" placeholder="Email" required>
      <input type="tel" placeholder="Nomor HP" required>
      <input type="password" placeholder="Password" required>
      <input type="password" placeholder="Konfirmasi Password" required>
      <button type="submit" class="btn">Daftar</button>
    </form>
    <p style="margin-top:16px;">Sudah punya akun? <a href="login.html">Login</a></p>
  </div>
</body>
</html>
